<!doctype html>
<html lang="en" class="h-full scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reach Disha - Discover suitable career paths based on your interests, abilities, and strengths. Powered by Reach India Pvt. Ltd." />
    <title>Reach Disha | Powered by Reach India Pvt. Ltd.</title>
    <style>
      @import "tailwindcss";

      @theme {
        --animate-marquee: marquee-scroll 35s linear infinite;
        --animate-fade-in: fadeIn 0.3s ease-out;
        --animate-card-progress: cardProgress 4.5s linear forwards;

        @keyframes marquee-scroll {
          0% {
            transform: translateX(0%);
          }
          100% {
            transform: translateX(-50%);
          }
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(3px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes cardProgress {
          0% {
            width: 0%;
          }
          100% {
            width: 100%;
          }
        }
      }

      @utility container {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding-inline: 1rem;
        @variant sm {
          padding-inline: 1.5rem;
        }
        @variant lg {
          padding-inline: 2rem;
        }
      }

      :focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans antialiased overflow-x-hidden selection:bg-blue-100 selection:text-blue-900">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
