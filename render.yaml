services:
  # =========================================================================
  # 1. Backend Web Service (Node.js + Express 5 + Prisma ORM + MySQL)
  # =========================================================================
  - type: web
    name: reach-disha-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Enter your MySQL connection string (e.g. from Aiven, Railway, or TiDB)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  # =========================================================================
  # 2. Frontend Static Site (React 19 + Vite + Tailwind CSS SPA)
  # =========================================================================
  - type: web
    name: reach-disha-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Point to: https://reach-disha-backend.onrender.com/api
